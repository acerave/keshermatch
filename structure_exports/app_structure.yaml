- path: "page.tsx"
  content: "\"use client\";\n\nimport Image from \"next/image\";\nimport Link from\
    \ \"next/link\";\nimport React from \"react\";\nimport {\n  ArrowLeft,\n  BadgeCheck,\n\
    \  Brain,\n  HeartHandshake,\n  ShieldCheck,\n  Users,\n  PhoneCall,\n  MessagesSquare,\n\
    \  Crown,\n  Stars,\n  Gem,\n  UserRoundCheck,\n  HouseHeart,\n  Sparkles,\n}\
    \ from \"lucide-react\";\nimport { KesherAnimatedLogo } from \"./components/brand/KesherAnimatedLogo\"\
    ;\n\nconst tracks = [\n  {\n    href: \"/he/traditional\",\n    title: \"מסלול\
    \ מסורתי\",\n    description:\n      \"מתאים למשפחות ולאנשים שמחפשים תהליך מכב\
    ד, רגוע ומבוסס ערכים — עם אפשרות למעורבות הורית אמיתית.\",\n    gradient: \"from-amber-50\
    \ via-orange-50 to-rose-50\",\n    accent: \"from-orange-500 to-rose-500\",\n\
    \    icon: HouseHeart,\n  },\n  {\n    href: \"/he/secular\",\n    title: \"מס\
    לול מודרני\",\n    description:\n      \"למי שמעדיף חוויה אישית יותר, פרטיות ו\
    שליטה מלאה — ועדיין רוצה רצינות וכוונה אמיתית.\",\n    gradient: \"from-sky-50\
    \ via-white to-violet-50\",\n    accent: \"from-sky-500 to-violet-500\",\n   \
    \ icon: Brain,\n  },\n  {\n    href: \"/he/mixed\",\n    title: \"מסלול משולב\"\
    ,\n    description:\n      \"למי שחי בין עולמות וצריך גישה גמישה יותר — עם רגי\
    שות למשפחה, לערכים ולמציאות החיים.\",\n    gradient: \"from-rose-50 via-white\
    \ to-sky-50\",\n    accent: \"from-rose-500 via-orange-400 to-sky-500\",\n   \
    \ icon: Users,\n  },\n] as const;\n\nconst parentBenefits = [\n  {\n    icon:\
    \ Users,\n    title: \"מעורבות הורית מכבדת\",\n    text: \"המערכת נבנתה במיוחד\
    \ עבור מצבים שבהם הורים רוצים לסייע לילדים בתהליך — בלי להשתלט ובלי לפגוע בבחי\
    רה האישית.\",\n    accent: \"from-rose-500 to-orange-400\",\n  },\n  {\n    icon:\
    \ ShieldCheck,\n    title: \"אמון, רצינות ופרטיות\",\n    text: \"פחות רעש, פח\
    ות חוסר ודאות — יותר בהירות, כוונה אמיתית ותהליך שאפשר לסמוך עליו.\",\n    accent:\
    \ \"from-orange-500 to-amber-400\",\n  },\n  {\n    icon: HeartHandshake,\n  \
    \  title: \"שפה אנושית וחמה\",\n    text: \"לא עוד אתר היכרויות גנרי, אלא חווי\
    ה שמדברת למשפחות, לערכים ולרצון ליצור בית.\",\n    accent: \"from-sky-500 to-violet-500\"\
    ,\n  },\n] as const;\n\nconst processSteps = [\n  {\n    icon: PhoneCall,\n  \
    \  title: \"הורה או בן/בת משפחה מתחילים\",\n    text: \"ממלאים פרטים ראשוניים\
    \ ומסמנים את סוג המסלול והעדפות כלליות.\",\n  },\n  {\n    icon: UserRoundCheck,\n\
    \    title: \"התאמה רגישה ומדויקת יותר\",\n    text: \"התהליך לוקח בחשבון ערכי\
    ם, סגנון חיים, גבולות, רצונות משפחתיים ורצון אישי.\",\n  },\n  {\n    icon: MessagesSquare,\n\
    \    title: \"היכרות באופן מכבד\",\n    text: \"ההתקדמות נעשית בשלבים, עם יותר\
    \ שקיפות, כבוד ושיקול דעת — ולא בצורה אגרסיבית או מהירה מדי.\",\n  },\n] as const;\n\
    \nconst trustPoints = [\n  \"מיועד מלכתחילה גם למשפחות שמעורבות בתהליך\",\n  \"\
    חוויה הרבה יותר רצינית ומכבדת מאתר היכרויות רגיל\",\n  \"עיצוב שמרגיש מותג אמי\
    תי ולא אתר חובבני\",\n  \"דגש על פרטיות, כוונה, ערכים ויצירת אמון\",\n] as const;\n\
    \nconst stats = [\n  { value: \"3\", label: \"מסלולים ברורים לסוגי קהלים שונים\
    \" },\n  { value: \"100%\", label: \"שליטה על חשיפה והתקדמות בתהליך\" },\n  {\
    \ value: \"משפחה\", label: \"מקום מכבד גם להורים וגם לילדים\" },\n] as const;\n\
    \ntype Track = (typeof tracks)[number];\n\nfunction SectionHeader({\n  eyebrow,\n\
    \  title,\n  text,\n}: {\n  eyebrow: string;\n  title: string;\n  text: string;\n\
    }) {\n  return (\n    <div className=\"mx-auto max-w-3xl text-center\">\n    \
    \  <div className=\"mb-3 inline-flex rounded-full border border-stone-200 bg-white/85\
    \ px-4 py-1.5 text-xs font-bold uppercase tracking-[0.25em] text-stone-700 shadow-sm\"\
    >\n        {eyebrow}\n      </div>\n      <h2 className=\"text-3xl font-black\
    \ leading-tight md:text-5xl\">{title}</h2>\n      <p className=\"mx-auto mt-4\
    \ max-w-2xl text-lg leading-8 text-stone-700\">\n        {text}\n      </p>\n\
    \    </div>\n  );\n}\n\nfunction FloatingBadge({\n  icon: Icon,\n  text,\n}: {\n\
    \  icon: React.ElementType;\n  text: string;\n}) {\n  return (\n    <div className=\"\
    inline-flex items-center gap-2 rounded-full border border-white/70 bg-white/85\
    \ px-4 py-2 text-sm font-semibold text-stone-800 shadow-lg backdrop-blur\">\n\
    \      <Icon className=\"h-4 w-4 text-rose-500\" />\n      {text}\n    </div>\n\
    \  );\n}\n\nfunction TrackCard({ track }: { track: Track }) {\n  const Icon =\
    \ track.icon;\n\n  return (\n    <Link href={track.href} className=\"group block\"\
    >\n      <div\n        className={`relative h-full overflow-hidden rounded-[2rem]\
    \ bg-gradient-to-br ${track.gradient} p-6 shadow-[0_24px_70px_rgba(15,23,42,0.08)]\
