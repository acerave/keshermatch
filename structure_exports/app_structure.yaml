- path: "layout.tsx"
  content: "import type { Metadata } from \"next\";\nimport { Rubik, Assistant } from\
    \ \"next/font/google\";\nimport \"./globals.css\";\nimport Header from \"@/components/Header\"\
    ;\nimport Footer from \"@/components/Footer\";\n\nconst rubik = Rubik({\n  subsets:\
    \ [\"latin\", \"hebrew\"],\n  weight: [\"400\", \"500\", \"700\", \"800\", \"\
    900\"],\n  variable: \"--font-rubik\",\n  display: \"swap\",\n});\n\nconst assistant\
    \ = Assistant({\n  subsets: [\"latin\", \"hebrew\"],\n  weight: [\"400\", \"500\"\
    , \"600\", \"700\", \"800\"],\n  variable: \"--font-assistant\",\n  display: \"\
    swap\",\n});\n\nexport const metadata: Metadata = {\n  title: \"KesherMatch\"\
    ,\n  description: \"שידוכים להורים ולמשפחות שחושבים רחוק\",\n};\n\nexport default\
    \ function RootLayout({\n  children,\n}: Readonly<{\n  children: React.ReactNode;\n\
    }>) {\n  return (\n    <html lang=\"he\" dir=\"rtl\">\n      <body\n        className={`${rubik.variable}\
    \ ${assistant.variable} bg-white text-stone-900 antialiased`}\n      >\n     \
    \   <Header locale=\"he\" />\n        {children}\n        <Footer locale=\"he\"\
    \ />\n      </body>\n    </html>\n  );\n}"
