- path: "mixed\\page.tsx"
  content: "import { Compass, HeartHandshake, Layers3 } from \"lucide-react\";\r\n\
    import LandingPageShell from \"../components/brand/LandingPageShell\";\r\n\r\n\
    export default function MixedLandingPage() {\r\n  return (\r\n    <LandingPageShell\r\
    \n      active=\"mixed\"\r\n      badge=\"מסלול מעורב\"\r\n      title=\"מקום\
    \ שמחבר בין עולמות שונים בגישה רגישה וחכמה\"\r\n      titleGradient=\"from-rose-500\
    \ via-orange-400 to-sky-500\"\r\n      description=\"מסלול שנבנה עבור אנשים ומ\
    שפחות שלא תמיד נכנסים להגדרה אחת. גמיש יותר, פתוח יותר ורגיש יותר למורכבות אמי\
    תית.\"\r\n      heroGradient=\"from-rose-50 via-white to-sky-50\"\r\n      ctaText=\"\
    להצטרפות למסלול המעורב\"\r\n      ctaGradient=\"from-rose-500 via-orange-400 to-sky-500\"\
    \r\n      features={[\r\n        {\r\n          icon: Layers3,\r\n          title:\
    \ \"יותר ממסלול אחד\",\r\n          text: \"המוצר לא מכריח הגדרה אחת קשיחה — ה\
    וא נותן מקום למורכבות אמיתית.\",\r\n          accentClassName: \"from-rose-500\
    \ to-orange-400\",\r\n        },\r\n        {\r\n          icon: Compass,\r\n\
    \          title: \"רגישות לפערים\",\r\n          text: \"מתאים למצבים שבהם יש\
    \ הבדלים בין סגנונות חיים, משפחות או ציפיות.\",\r\n          accentClassName:\
    \ \"from-orange-500 to-sky-500\",\r\n        },\r\n        {\r\n          icon:\
    \ HeartHandshake,\r\n          title: \"גישור וחיבור\",\r\n          text: \"ש\
    פה רגישה ומכבדת שנועדה לעזור לחבר בין עולמות במקום ליצור התנגדות.\",\r\n     \
    \     accentClassName: \"from-rose-500 to-sky-500\",\r\n        },\r\n      ]}\r\
    \n      columns={[\r\n        {\r\n          title: \"פתיחות\",\r\n          text:\
    \ \"אין צורך לבחור תווית אחת בלבד. המסלול מכבד טווחים וגמישות.\",\r\n        },\r\
    \n        {\r\n          title: \"גישור\",\r\n          text: \"השפה והחוויה ע\
    וזרות לחבר בין משפחות ואנשים מרקעים שונים יותר.\",\r\n        },\r\n        {\r\
    \n          title: \"רגישות\",\r\n          text: \"מנוע ההתאמה לוקח בחשבון גם\
    \ ערכים וגם סגנון חיים וגם גבולות אישיים.\",\r\n        },\r\n      ]}\r\n   \
    \   faqs={[\r\n        {\r\n          q: \"למי המסלול הזה מתאים?\",\r\n      \
    \    a: \"לאנשים ולמשפחות שמגיעים מרקעים שונים, או למי שלא מרגיש שייך להגדרה א\
    חת ברורה.\",\r\n        },\r\n        {\r\n          q: \"מה מייחד אותו לעומת\
    \ מסלולים אחרים?\",\r\n          a: \"הגמישות. הוא נבנה כדי להכיל מורכבות אמית\
    ית ולא להכריח את המשתמשים לקופסה אחת.\",\r\n        },\r\n        {\r\n      \
    \    q: \"איך זה נראה בפועל?\",\r\n          a: \"פחות שיפוטי, יותר פתוח, יותר\
    \ רגיש להבדלים ויותר חכם באופן שבו הוא מציג התאמות.\",\r\n        },\r\n     \
    \ ]}\r\n    />\r\n  );\r\n}\r\n<section className=\"mt-20 text-center\">\r\n \
    \ <h2 className=\"text-3xl font-bold\">רוצים להתחיל?</h2>\r\n  <p className=\"\
    mt-4 text-stone-600\">השאירו פרטים ונחזור אליכם עם התאמות ראשונות</p>\r\n\r\n\
    \  <button className=\"mt-6 bg-black text-white px-8 py-3 rounded-full\">\r\n\
    \    הצטרפות מוקדמת\r\n  </button>\r\n</section>"
