  content: "import IntlHomePage from \"@/app/components/i18n/IntlHomePage\";\r\nimport\
    \ IsraelHomePage from \"@/app/page\";\r\n\r\ntype Props = {\r\n  params: Promise<{\r\
    \n    locale: string;\r\n  }>;\r\n};\r\n\r\nexport default async function LocalePage({\
    \ params }: Props) {\r\n  const { locale } = await params;\r\n  const normalizedLocale\
    \ = locale?.toLowerCase();\r\n\r\n  if (normalizedLocale === \"he\" || normalizedLocale\
    \ === \"iw\") {\r\n    return <IsraelHomePage />;\r\n  }\r\n\r\n  if (\r\n   \
    \ normalizedLocale === \"en\" ||\r\n    normalizedLocale === \"fr\" ||\r\n   \
    \ normalizedLocale === \"es\"\r\n  ) {\r\n    return <IntlHomePage locale={normalizedLocale\
    \ as any} />;\r\n  }\r\n\r\n  return <IsraelHomePage />;\r\n}"
