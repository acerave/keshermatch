- path: "components\\brand\\LandingPageShell.tsx"
  content: "import Link from \"next/link\";\r\nimport { LucideIcon } from \"lucide-react\"\
    ;\r\nimport KesherLogo from \"./KesherLogo\";\r\nimport PrimaryButton from \"\
    ./PrimaryButton\";\r\nimport FeatureCard from \"./FeatureCard\";\r\n\r\ntype LandingFeature\
    \ = {\r\n  title: string;\r\n  text: string;\r\n  icon: LucideIcon;\r\n  accentClassName?:\
    \ string;\r\n};\r\n\r\ntype LandingPageShellProps = {\r\n  active: \"traditional\"\
    \ | \"secular\" | \"mixed\";\r\n  badge: string;\r\n  title: string;\r\n  titleGradient:\
    \ string;\r\n  description: string;\r\n  heroGradient: string;\r\n  ctaText: string;\r\
    \n  ctaGradient: string;\r\n  features: LandingFeature[];\r\n  columns: { title:\
    \ string; text: string }[];\r\n  faqs: { q: string; a: string }[];\r\n};\r\n\r\
    \nexport default function LandingPageShell({\r\n  active,\r\n  badge,\r\n  title,\r\
    \n  titleGradient,\r\n  description,\r\n  heroGradient,\r\n  ctaText,\r\n  ctaGradient,\r\
    \n  features,\r\n  columns,\r\n  faqs,\r\n}: LandingPageShellProps) {\r\n  return\
    \ (\r\n    <div\r\n      dir=\"rtl\"\r\n      className=\"min-h-screen bg-[radial-gradient(circle_at_top_right,_rgba(251,146,60,0.12),_transparent_28%),radial-gradient(circle_at_top_left,_rgba(14,165,233,0.10),_transparent_25%),linear-gradient(to_bottom,_#fffaf7,_#ffffff,_#f8fafc)]\
    \ text-stone-900\"\r\n    >\r\n      <header className=\"sticky top-0 z-30 border-b\
    \ border-white/70 bg-white/75 backdrop-blur-2xl\">\r\n        <div className=\"\
    mx-auto flex max-w-7xl items-center justify-between px-6 py-4\">\r\n         \
    \ <Link href=\"/\">\r\n            <KesherLogo tagline=\"Heart, connection, family,\
    \ progress\" />\r\n          </Link>\r\n\r\n          <nav className=\"hidden\
    \ items-center gap-6 text-sm font-medium md:flex\">\r\n            <Link\r\n \
    \             href=\"/traditional\"\r\n              className={\r\n         \
    \       active === \"traditional\"\r\n                  ? \"text-orange-600\"\r\
    \n                  : \"transition hover:text-orange-600\"\r\n              }\r\
    \n            >\r\n              מסורתיים\r\n            </Link>\r\n\r\n     \
    \       <Link\r\n              href=\"/secular\"\r\n              className={\r\
    \n                active === \"secular\"\r\n                  ? \"text-sky-600\"\
    \r\n                  : \"transition hover:text-sky-600\"\r\n              }\r\
    \n            >\r\n              חילוניים\r\n            </Link>\r\n\r\n     \
    \       <Link\r\n              href=\"/mixed\"\r\n              className={\r\n\
    \                active === \"mixed\"\r\n                  ? \"text-rose-600\"\
    \r\n                  : \"transition hover:text-rose-600\"\r\n              }\r\
    \n            >\r\n              מעורב\r\n            </Link>\r\n          </nav>\r\
    \n        </div>\r\n      </header>\r\n\r\n      <main className=\"mx-auto max-w-7xl\
    \ px-6 py-10 md:py-16\">\r\n        <section\r\n          className={`relative\
    \ overflow-hidden rounded-[3rem] border border-white/80 bg-gradient-to-br ${heroGradient}\
    \ p-10 shadow-[0_30px_80px_rgba(15,23,42,0.08)] md:p-16`}\r\n        >\r\n   \
    \       <div className=\"absolute -left-10 top-10 h-44 w-44 rounded-full bg-sky-200/35\
    \ blur-3xl\" />\r\n          <div className=\"absolute bottom-0 right-0 h-56 w-56\
    \ rounded-full bg-orange-200/35 blur-3xl\" />\r\n\r\n          <div className=\"\
    relative grid gap-12 md:grid-cols-[1.05fr_0.95fr] md:items-center\">\r\n     \
    \       <div>\r\n              <div className=\"mb-5 inline-flex rounded-full\
    \ border border-white/70 bg-white/80 px-4 py-2 text-sm font-semibold text-stone-700\
    \ shadow-sm\">\r\n                {badge}\r\n              </div>\r\n\r\n    \
    \          <h1 className=\"text-5xl font-black leading-[1.05] md:text-7xl\">\r\
    \n                <span\r\n                  className={`bg-gradient-to-r ${titleGradient}\
    \ bg-clip-text text-transparent`}\r\n                >\r\n                  {title}\r\
    \n                </span>\r\n              </h1>\r\n\r\n              <p className=\"\
    mt-6 max-w-3xl text-lg leading-8 text-stone-700 md:text-xl\">\r\n            \
    \    {description}\r\n              </p>\r\n\r\n              <div className=\"\
    mt-8\">\r\n                <PrimaryButton className={`bg-gradient-to-r ${ctaGradient}`}>\r\
    \n                  {ctaText}\r\n                </PrimaryButton>\r\n        \
    \      </div>\r\n            </div>\r\n\r\n            <div className=\"grid gap-4\"\
    >\r\n              {features.map((feature) => (\r\n                <FeatureCard\r\
    \n                  key={feature.title}\r\n                  icon={feature.icon}\r\
    \n                  title={feature.title}\r\n                  text={feature.text}\r\
    \n                  accentClassName={feature.accentClassName}\r\n            \
    \    />\r\n              ))}\r\n            </div>\r\n          </div>\r\n   \
    \     </section>\r\n\r\n        <section className=\"mt-20 grid gap-6 md:grid-cols-3\"\
    >\r\n          {columns.map((item) => (\r\n            <div\r\n              key={item.title}\r\
    \n              className=\"rounded-[2rem] bg-white/85 p-6 shadow-lg shadow-stone-200/60\
    \ ring-1 ring-white/80 transition duration-300 hover:-translate-y-1 hover:shadow-2xl\"\
    \r\n            >\r\n              <h3 className=\"text-2xl font-bold text-stone-900\"\
    >{item.title}</h3>\r\n              <p className=\"mt-3 leading-8 text-stone-600\"\
    >{item.text}</p>\r\n            </div>\r\n          ))}\r\n        </section>\r\
    \n\r\n        <section className=\"mt-20 rounded-[2rem] bg-white p-8 shadow-[0_24px_70px_rgba(15,23,42,0.08)]\
    \ ring-1 ring-stone-100 md:p-10\">\r\n          <h2 className=\"text-3xl font-black\
    \ md:text-4xl\">שאלות נפוצות</h2>\r\n\r\n          <div className=\"mt-8 space-y-4\"\
    >\r\n            {faqs.map((item) => (\r\n              <details\r\n         \
    \       key={item.q}\r\n                className=\"group rounded-[1.5rem] border\
    \ border-stone-200 bg-stone-50 p-6 transition hover:bg-white\"\r\n           \
    \   >\r\n                <summary className=\"cursor-pointer text-lg font-bold\
    \ text-stone-800\">\r\n                  {item.q}\r\n                </summary>\r\
    \n                <p className=\"mt-4 leading-8 text-stone-600\">{item.a}</p>\r\
    \n              </details>\r\n            ))}\r\n          </div>\r\n        </section>\r\
    \n      </main>\r\n    </div>\r\n  );\r\n}"
