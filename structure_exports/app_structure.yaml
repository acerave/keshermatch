    #faq\", label: \"FAQ\" },\r\n      ];\r\n\r\n  return (\r\n    <header className=\"\
    sticky top-0 z-50 border-b border-stone-200/70 bg-white/90 backdrop-blur-md\"\
    >\r\n      <div className=\"mx-auto flex max-w-7xl items-center justify-between\
