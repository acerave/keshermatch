- path: "components\\i18n\\IntlHomePage.tsx"
  content: "\"use client\";\r\n\r\nimport Image from \"next/image\";\r\nimport Link\
    \ from \"next/link\";\r\nimport {\r\n  ArrowRight,\r\n  Brain,\r\n  Crown,\r\n\
    \  Globe2,\r\n  HeartHandshake,\r\n  Lock,\r\n  ShieldCheck,\r\n  Sparkles,\r\n\
    \  Stars,\r\n  UserRoundCheck,\r\n} from \"lucide-react\";\r\nimport { Locale,\
    \ getMessages } from \"../../[locale]/site-data\";\r\nimport { KesherAnimatedLogo\
    \ } from \"../brand/KesherAnimatedLogo\";\r\nimport LocaleSwitcher from \"./LocaleSwitcher\"\
    ;\r\n\r\nconst pageStyles = {\r\n  traditional: {\r\n    href: \"traditional\"\
    ,\r\n    gradient: \"from-amber-50 via-orange-50 to-rose-50\",\r\n    button:\
    \ \"from-orange-500 to-rose-500\",\r\n    icon: HeartHandshake,\r\n  },\r\n  secular:\
    \ {\r\n    href: \"secular\",\r\n    gradient: \"from-sky-50 via-white to-violet-50\"\
    ,\r\n    button: \"from-sky-500 to-violet-500\",\r\n    icon: Brain,\r\n  },\r\
    \n  mixed: {\r\n    href: \"mixed\",\r\n    gradient: \"from-rose-50 via-white\
    \ to-sky-50\",\r\n    button: \"from-rose-500 via-orange-400 to-sky-500\",\r\n\
    \    icon: Globe2,\r\n  },\r\n} as const;\r\n\r\nexport function validateIntlLeadForm(\r\
    \n  values: { fullName?: string; email?: string; track?: string },\r\n  locale:\
    \ Locale\r\n) {\r\n  const t = getMessages(locale);\r\n  const fullName = String(values.fullName\
    \ ?? \"\").trim();\r\n  const email = String(values.email ?? \"\").trim();\r\n\
    \  const track = String(values.track ?? \"\").trim();\r\n\r\n  if (!fullName)\
    \ {\r\n    return { ok: false, message: t.validation.fullName };\r\n  }\r\n\r\n\
    \  if (!email) {\r\n    return { ok: false, message: t.validation.email };\r\n\
    \  }\r\n\r\n  const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\r\n  if (!emailPattern.test(email))\
    \ {\r\n    return { ok: false, message: t.validation.emailInvalid };\r\n  }\r\n\
    \r\n  if (![\"traditional\", \"secular\", \"mixed\"].includes(track)) {\r\n  \
    \  return { ok: false, message: t.validation.track };\r\n  }\r\n\r\n  const trackLabel\
    \ =\r\n    t.tracks[track as \"traditional\" | \"secular\" | \"mixed\"].label;\r\
    \n\r\n  return {\r\n    ok: true,\r\n    message: t.validation.success\r\n   \
    \   .replace(\"{name}\", fullName)\r\n      .replace(\"{track}\", trackLabel)\r\
    \n      .replace(\"{email}\", email),\r\n  };\r\n}\r\n\r\nfunction SectionTitle({\r\
    \n  badge,\r\n  title,\r\n  text,\r\n}: {\r\n  badge: string;\r\n  title: string;\r\
    \n  text: string;\r\n}) {\r\n  return (\r\n    <div className=\"mx-auto max-w-3xl\
    \ text-center\">\r\n      <div className=\"mb-3 inline-flex rounded-full border\
    \ border-stone-200 bg-white/85 px-4 py-1.5 text-xs font-bold uppercase tracking-[0.25em]\
    \ text-stone-500 shadow-sm\">\r\n        {badge}\r\n      </div>\r\n      <h2\
    \ className=\"text-3xl font-black leading-tight md:text-5xl\">{title}</h2>\r\n\
    \      <p className=\"mx-auto mt-4 max-w-2xl text-lg leading-8 text-stone-600\"\
    >\r\n        {text}\r\n      </p>\r\n    </div>\r\n  );\r\n}\r\n\r\nexport default\
    \ function IntlHomePage({ locale }: { locale: Locale }) {\r\n  const t = getMessages(locale);\r\
    \n\r\n  const handleSubmit = (event: React.FormEvent<HTMLFormElement>) => {\r\n\
    \    event.preventDefault();\r\n    const form = event.currentTarget;\r\n    const\
    \ formData = new FormData(form);\r\n\r\n    const result = validateIntlLeadForm(\r\
    \n      {\r\n        fullName: String(formData.get(\"fullName\") ?? \"\"),\r\n\
    \        email: String(formData.get(\"email\") ?? \"\"),\r\n        track: String(formData.get(\"\
    track\") ?? \"\"),\r\n      },\r\n      locale\r\n    );\r\n\r\n    if (!result.ok)\
    \ {\r\n      window.alert(result.message);\r\n      return;\r\n    }\r\n\r\n \
    \   window.alert(result.message);\r\n    form.reset();\r\n  };\r\n\r\n  return\
    \ (\r\n    <div\r\n      dir={t.direction}\r\n      className=\"min-h-screen overflow-x-hidden\
    \ bg-[linear-gradient(to_bottom,_#fffaf7_0%,_#ffffff_32%,_#f8fafc_100%)] text-stone-900\"\
    \r\n    >\r\n      <header className=\"sticky top-0 z-30 border-b border-stone-200/70\
    \ bg-white/80 backdrop-blur-2xl\">\r\n        <div className=\"mx-auto flex w-full\
    \ max-w-[1440px] items-center justify-between px-4 py-4 md:px-6\">\r\n       \
    \   <Link href={`/${locale}`}>\r\n            <KesherAnimatedLogo tagline=\"Love.\
    \ Family. Smart Connection.\" />\r\n          </Link>\r\n\r\n          <div className=\"\
    flex items-center gap-4\">\r\n            <nav className=\"hidden items-center\
    \ gap-6 text-sm font-medium text-stone-700 lg:flex\">\r\n              <Link\r\
    \n                href={`/${locale}/traditional`}\r\n                className=\"\
    transition hover:text-stone-950\"\r\n              >\r\n                {t.nav.traditional}\r\
    \n              </Link>\r\n              <Link\r\n                href={`/${locale}/secular`}\r\
    \n                className=\"transition hover:text-stone-950\"\r\n          \
    \    >\r\n                {t.nav.secular}\r\n              </Link>\r\n       \
    \       <Link\r\n                href={`/${locale}/mixed`}\r\n               \
    \ className=\"transition hover:text-stone-950\"\r\n              >\r\n       \
    \         {t.nav.mixed}\r\n              </Link>\r\n            </nav>\r\n\r\n\
    \            <LocaleSwitcher currentLocale={locale} />\r\n          </div>\r\n      \
    \  </div>\r\n      </header>\r\n\r\n      <main className=\"mx-auto w-full max-w-[1440px]\
    \ px-4 py-8 md:px-6 md:py-12\">\r\n        {/* HERO */}\r\n        <section className=\"\
    relative mt-2 overflow-hidden rounded-[2.5rem] border border-white/10 bg-[linear-gradient(135deg,#111218,#181a20,#0f172a)]\
    \ p-8 text-white shadow-[0_30px_100px_rgba(0,0,0,0.35)] md:p-14\">\r\n       \
    \   <div className=\"absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(251,146,60,0.18),transparent_26%),radial-gradient(circle_at_bottom_right,rgba(14,165,233,0.16),transparent_28%),radial-gradient(circle_at_top_right,rgba(244,63,94,0.12),transparent_24%)]\"\
    \ />\r\n          <div className=\"absolute inset-0 opacity-[0.08] [background-image:linear-gradient(rgba(255,255,255,1)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,1)_1px,transparent_1px)]\
    \ [background-size:44px_44px]\" />\r\n\r\n          <div className=\"relative\
    \ grid gap-10 md:grid-cols-[1.02fr_0.98fr] md:items-center\">\r\n            <div>\r\
    \n              <div className=\"mb-5 inline-flex items-center gap-2 rounded-full\
    \ border border-white/10 bg-white/5 px-4 py-2 text-sm font-semibold text-white/90\
    \ shadow-lg\">\r\n                <Sparkles className=\"h-4 w-4 text-orange-300\"\
    \ />\r\n                {t.home.badge}\r\n              </div>\r\n\r\n       \
    \       <h1 className=\"max-w-3xl text-5xl font-black leading-[1.02] md:text-7xl\"\
    >\r\n                {t.home.title1}\r\n                <span className=\"mt-1\
    \ block bg-gradient-to-r from-rose-300 via-orange-300 to-sky-300 bg-clip-text\
    \ text-transparent\">\r\n                  {t.home.title2}\r\n               \
    \ </span>\r\n              </h1>\r\n\r\n              <p className=\"mt-6 max-w-2xl\
    \ text-lg leading-8 text-stone-300 md:text-xl\">\r\n                {t.home.description}\r\
    \n              </p>\r\n\r\n              <div className=\"mt-8 flex flex-wrap\
    \ gap-4\">\r\n                <button\r\n                  onClick={() =>\r\n\
    \                    document\r\n                      .getElementById(\"lead-form\"\
    )\r\n                      ?.scrollIntoView({ behavior: \"smooth\" })\r\n    \
    \              }\r\n                  className=\"rounded-full bg-gradient-to-r\
    \ from-rose-500 via-orange-400 to-sky-500 px-8 py-4 text-lg font-semibold text-white\
    \ shadow-[0_18px_50px_rgba(251,146,60,0.28)] transition duration-300 hover:-translate-y-0.5\
    \ hover:scale-[1.02]\"\r\n                >\r\n                  {t.nav.earlyAccess}\r\
    \n                </button>\r\n\r\n                <a\r\n                  href=\"\
    #tracks\"\r\n                  className=\"rounded-full border border-white/15\
    \ bg-white/5 px-8 py-4 text-lg font-semibold text-white shadow-md transition duration-300\
    \ hover:bg-white/10\"\r\n                >\r\n                  Explore Tracks\r\
    \n                </a>\r\n              </div>\r\n\r\n              <div className=\"\
    mt-10 grid gap-4 sm:grid-cols-3\">\r\n                <div className=\"rounded-2xl\
    \ border border-white/10 bg-white/5 p-4 backdrop-blur\">\r\n                 \
    \ <ShieldCheck className=\"mb-3 h-5 w-5 text-sky-300\" />\r\n                \
    \  <div className=\"text-sm font-semibold text-white\">\r\n                  \
    \  Privacy-first\r\n                  </div>\r\n                  <p className=\"\
    mt-1 text-sm leading-6 text-stone-300\">\r\n                    Control visibility,\
    \ photos and pace.\r\n                  </p>\r\n                </div>\r\n\r\n\
    \                <div className=\"rounded-2xl border border-white/10 bg-white/5\
    \ p-4 backdrop-blur\">\r\n                  <Brain className=\"mb-3 h-5 w-5 text-orange-300\"\
    \ />\r\n                  <div className=\"text-sm font-semibold text-white\"\
    >\r\n                    AI-assisted\r\n                  </div>\r\n         \
    \         <p className=\"mt-1 text-sm leading-6 text-stone-300\">\r\n        \
    \            Smart guidance without losing the human touch.\r\n              \
    \    </p>\r\n                </div>\r\n\r\n                <div className=\"rounded-2xl\
    \ border border-white/10 bg-white/5 p-4 backdrop-blur\">\r\n                 \
    \ <Crown className=\"mb-3 h-5 w-5 text-rose-300\" />\r\n                  <div\
