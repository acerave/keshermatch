- path: "components\\brand\\KesherAnimatedLogo.tsx"
  content: "\"use client\";\r\n\r\nimport { Heart, Users } from \"lucide-react\";\r\
    \n\r\ntype Props = {\r\n  tagline?: string;\r\n};\r\n\r\nexport function KesherAnimatedLogo({\r\
    \n  tagline = \"Love. Family. Smart Match\",\r\n}: Props) {\r\n  return (\r\n\
    \    <div className=\"flex items-center gap-3\">\r\n      <div className=\"relative\
    \ h-16 w-16\">\r\n        {/* Glow */}\r\n        <div className=\"absolute inset-0\
    \ rounded-full bg-gradient-to-br from-rose-500 via-orange-400 to-sky-500 blur-xl\
    \ opacity-60 animate-pulse\" />\r\n\r\n        {/* Orbit ring */}\r\n        <div\r\
    \n          className=\"absolute inset-0 rounded-full border border-white/40\"\
    \r\n          style={{ animation: \"spin 6s linear infinite\" }}\r\n        />\r\
    \n\r\n        {/* Core */}\r\n        <div className=\"absolute inset-2 rounded-full\
    \ bg-gradient-to-br from-rose-500 via-orange-400 to-sky-500 shadow-lg flex items-center\
    \ justify-center\">\r\n          <Heart className=\"text-white w-6 h-6\" />\r\n\
    \        </div>\r\n\r\n        {/* Orbit element */}\r\n        <div\r\n     \
    \     className=\"absolute top-0 left-1/2 -translate-x-1/2\"\r\n          style={{\
    \ animation: \"spin 4s linear infinite reverse\" }}\r\n        >\r\n         \
    \ <Users className=\"text-white w-4 h-4\" />\r\n        </div>\r\n      </div>\r\
    \n\r\n      <div>\r\n        <div className=\"text-2xl font-black\">KesherMatch</div>\r\
    \n        <div className=\"text-sm text-gray-500\">{tagline}</div>\r\n      </div>\r\
    \n\r\n      <style jsx>{`\r\n        @keyframes spin {\r\n          from {\r\n\
    \            transform: rotate(0deg) translateX(0);\r\n          }\r\n       \
    \   to {\r\n            transform: rotate(360deg) translateX(0);\r\n         \
    \ }\r\n        }\r\n      `}</style>\r\n    </div>\r\n  );\r\n}"
