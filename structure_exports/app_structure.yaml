- path: "components\\brand\\FeatureCard.tsx"
  content: "import * as React from \"react\";\r\nimport { LucideIcon } from \"lucide-react\"\
    ;\r\n\r\ntype FeatureCardProps = {\r\n  icon: LucideIcon;\r\n  title: string;\r\
    \n  text: string;\r\n  accentClassName?: string;\r\n};\r\n\r\nexport default function\
    \ FeatureCard({\r\n  icon: Icon,\r\n  title,\r\n  text,\r\n  accentClassName =\
    \ \"from-rose-500 to-orange-400\",\r\n}: FeatureCardProps) {\r\n  return (\r\n\
    \    <div className=\"group rounded-[2rem] bg-white/85 p-6 shadow-lg shadow-stone-200/60\
    \ ring-1 ring-white/80 transition duration-300 hover:-translate-y-1 hover:shadow-2xl\"\
    >\r\n      <div className={`mb-5 inline-flex h-12 w-12 items-center justify-center\
    \ rounded-2xl bg-gradient-to-br ${accentClassName} text-white shadow-lg transition\
    \ duration-300 group-hover:scale-105`}>\r\n        <Icon className=\"h-6 w-6\"\
    \ />\r\n      </div>\r\n      <h3 className=\"text-xl font-bold text-stone-900\"\
    >{title}</h3>\r\n      <p className=\"mt-3 leading-8 text-stone-600\">{text}</p>\r\
    \n    </div>\r\n  );\r\n}"
