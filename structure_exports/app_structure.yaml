    >\r\n          <Image\r\n            src={logoSrc}\r\n            alt={isHebrew\
    \ ? \"קשר\" : \"KesherMatch\"}\r\n            width={190}\r\n            height={70}\r\
    \n            priority\r\n            className=\"h-12 w-auto md:h-14\"\r\n  \
    \        />\r\n        </Link>\r\n\r\n        <nav className=\"hidden items-center\
    \ gap-8 md:flex\">\r\n          {navItems.map((item) => (\r\n            <a\r\n\
    \              key={item.href}\r\n              href={item.href}\r\n         \
    \     className=\"font-body text-sm font-semibold text-stone-700 transition hover:text-stone-950\"\
    \r\n            >\r\n              {item.label}\r\n            </a>\r\n      \
    \    ))}\r\n        </nav>\r\n\r\n        <div className=\"hidden items-center\
    \ gap-3 md:flex\">\r\n          <Link\r\n            href=\"/login\"\r\n     \
    \       className=\"rounded-full border border-stone-300 px-4 py-2 font-body text-sm\
    \ font-semibold text-stone-800 transition hover:bg-stone-50\"\r\n          >\r\
    \n            {isHebrew ? \"כניסה\" : \"Login\"}\r\n          </Link>\r\n\r\n\
    \          <Link\r\n            href=\"/register\"\r\n            className=\"\
    rounded-full bg-stone-900 px-5 py-2.5 font-body text-sm font-semibold text-white\
    \ transition hover:bg-stone-800\"\r\n          >\r\n            {isHebrew ? \"\
    הרשמה\" : \"Sign Up\"}\r\n          </Link>\r\n        </div>\r\n\r\n        <button\r\
    \n          type=\"button\"\r\n          onClick={() => setMobileOpen((prev) =>\
    \ !prev)}\r\n          className=\"inline-flex items-center justify-center rounded-xl\
    \ border border-stone-300 p-2 text-stone-800 md:hidden\"\r\n          aria-label={isHebrew\
    \ ? \"פתח תפריט\" : \"Open menu\"}\r\n        >\r\n          {mobileOpen ? <X\
    \ className=\"h-5 w-5\" /> : <Menu className=\"h-5 w-5\" />}\r\n        </button>\r\
    \n      </div>\r\n\r\n      {mobileOpen && (\r\n        <div className=\"border-t\
    \ border-stone-200 bg-white md:hidden\">\r\n          <div className=\"mx-auto\
    \ flex max-w-7xl flex-col gap-2 px-4 py-4\">\r\n            {navItems.map((item)\
    \ => (\r\n              <a\r\n                key={item.href}\r\n            \
    \    href={item.href}\r\n                onClick={() => setMobileOpen(false)}\r\
    \n                className=\"rounded-xl px-3 py-3 font-body text-sm font-semibold\
    \ text-stone-700 transition hover:bg-stone-50 hover:text-stone-950\"\r\n     \
    \         >\r\n                {item.label}\r\n              </a>\r\n        \
    \    ))}\r\n\r\n            <div className=\"mt-3 flex flex-col gap-2 border-t\
    \ border-stone-200 pt-3\">\r\n              <Link\r\n                href=\"/login\"\
    \r\n                onClick={() => setMobileOpen(false)}\r\n                className=\"\
    rounded-full border border-stone-300 px-4 py-3 text-center font-body text-sm font-semibold\
