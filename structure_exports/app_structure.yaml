- path: "components\\i18n\\LocaleSwitcher.tsx"
  content: "\"use client\";\r\n\r\nimport Link from \"next/link\";\r\nimport { usePathname\
    \ } from \"next/navigation\";\r\nimport { Locale, supportedLocales } from \"../../[locale]/site-data\"\
    ;\r\n\r\nconst localeLabels: Record<Locale, string> = {\r\n  en: \"English\",\r\
    \n  fr: \"Français\",\r\n  es: \"Español\",\r\n};\r\n\r\nexport default function\
    \ LocaleSwitcher({ locale }: { locale: Locale }) {\r\n  const pathname = usePathname();\r\
    \n  const pathWithoutLocale = pathname.replace(/^\\/(en|fr|es)(?=\\/|$)/, \"\"\
    ) || \"/\";\r\n\r\n  return (\r\n    <div className=\"flex items-center gap-2\"\
    >\r\n      {supportedLocales.map((item) => {\r\n        const href = `/${item}${pathWithoutLocale\
    \ === \"/\" ? \"\" : pathWithoutLocale}`;\r\n        const isActive = item ===\
    \ locale;\r\n\r\n        return (\r\n          <Link\r\n            key={item}\r\
    \n            href={href}\r\n            className={`rounded-full px-3 py-1.5\
    \ text-sm font-medium transition ${\r\n              isActive\r\n            \
    \    ? \"bg-stone-900 text-white\"\r\n                : \"bg-white text-stone-700\
    \ ring-1 ring-stone-200 hover:bg-stone-50\"\r\n            }`}\r\n          >\r\
    \n            {localeLabels[item]}\r\n          </Link>\r\n        );\r\n    \
    \  })}\r\n    </div>\r\n  );\r\n}\r\n"
