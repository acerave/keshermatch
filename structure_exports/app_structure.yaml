- path: "components\\brand\\KesherLogo.tsx"
  content: "import * as React from \"react\";\r\n\r\ntype KesherLogoProps = {\r\n\
    \  size?: number;\r\n  showText?: boolean;\r\n  textColorClassName?: string;\r\
    \n  tagline?: string;\r\n};\r\n\r\nexport default function KesherLogo({\r\n  size\
    \ = 54,\r\n  showText = true,\r\n  textColorClassName = \"text-stone-900\",\r\n\
    \  tagline = \"Smart matchmaking with heart, family and progress\",\r\n}: KesherLogoProps)\
    \ {\r\n  return (\r\n    <div className=\"flex items-center gap-3\">\r\n     \
    \ <svg\r\n        width={size}\r\n        height={size}\r\n        viewBox=\"\
    0 0 64 64\"\r\n        fill=\"none\"\r\n        xmlns=\"http://www.w3.org/2000/svg\"\
    \r\n        className=\"drop-shadow-[0_10px_25px_rgba(251,146,60,0.25)]\"\r\n\
    \        aria-label=\"KesherMatch logo\"\r\n        role=\"img\"\r\n      >\r\n\
    \        <defs>\r\n          <linearGradient id=\"km-gradient-main\" x1=\"8\"\
    \ y1=\"8\" x2=\"56\" y2=\"56\" gradientUnits=\"userSpaceOnUse\">\r\n         \
    \   <stop stopColor=\"#F43F5E\" />\r\n            <stop offset=\"0.45\" stopColor=\"\
    #FB923C\" />\r\n            <stop offset=\"1\" stopColor=\"#0EA5E9\" />\r\n  \
    \        </linearGradient>\r\n          <linearGradient id=\"km-gradient-soft\"\
    \ x1=\"16\" y1=\"14\" x2=\"48\" y2=\"52\" gradientUnits=\"userSpaceOnUse\">\r\n\
    \            <stop stopColor=\"#FFF1F2\" />\r\n            <stop offset=\"1\"\
    \ stopColor=\"#FFFFFF\" />\r\n          </linearGradient>\r\n        </defs>\r\
    \n\r\n        <rect x=\"6\" y=\"6\" width=\"52\" height=\"52\" rx=\"18\" fill=\"\
    url(#km-gradient-main)\" />\r\n        <rect x=\"10\" y=\"10\" width=\"44\" height=\"\
    44\" rx=\"15\" fill=\"url(#km-gradient-soft)\" fillOpacity=\"0.14\" />\r\n\r\n\
    \        <path\r\n          d=\"M22 23C22 20.7909 23.7909 19 26 19C28.0801 19\
    \ 29.7883 20.5878 29.9787 22.6173C30.1691 20.5878 31.8773 19 33.9574 19C36.1665\
    \ 19 37.9574 20.7909 37.9574 23C37.9574 30.4 29.9787 35.5 29.9787 35.5C29.9787\
    \ 35.5 22 30.4 22 23Z\"\r\n          fill=\"white\"\r\n          fillOpacity=\"\
    0.96\"\r\n        />\r\n\r\n        <path\r\n          d=\"M18 39C20.2 35.8 23.6\
    \ 34 27.4 34H32.6C36.4 34 39.8 35.8 42 39\"\r\n          stroke=\"white\"\r\n\
    \          strokeWidth=\"3.2\"\r\n          strokeLinecap=\"round\"\r\n      \
    \  />\r\n\r\n        <path\r\n          d=\"M24.5 42.5C27.5 45.2 32.3 45.2 35.3\
    \ 42.5\"\r\n          stroke=\"white\"\r\n          strokeWidth=\"3\"\r\n    \
    \      strokeLinecap=\"round\"\r\n        />\r\n\r\n        <circle cx=\"46.5\"\
    \ cy=\"18.5\" r=\"4.5\" fill=\"#FFFFFF\" fillOpacity=\"0.95\" />\r\n        <path\
    \ d=\"M46.5 15.5V21.5M43.5 18.5H49.5\" stroke=\"#F97316\" strokeWidth=\"2.3\"\
    \ strokeLinecap=\"round\" />\r\n      </svg>\r\n\r\n      {showText ? (\r\n  \
    \      <div>\r\n          <div className={`text-xl font-black tracking-tight ${textColorClassName}`}>KesherMatch</div>\r\
    \n          <div className=\"text-xs font-medium text-stone-500\">{tagline}</div>\r\
    \n        </div>\r\n      ) : null}\r\n    </div>\r\n  );\r\n}"
